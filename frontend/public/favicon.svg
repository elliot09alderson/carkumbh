<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Toran Sir — TS monogram">
  <defs>
    <linearGradient id="ts-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5CC42"/>
      <stop offset="55%" stop-color="#E9B308"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="ts-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171C28"/>
      <stop offset="100%" stop-color="#0B0E15"/>
    </linearGradient>
  </defs>

  <!-- Rounded navy tile -->
  <rect width="64" height="64" rx="14" fill="url(#ts-bg)"/>
  <!-- Subtle gold border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="12"
        fill="none" stroke="url(#ts-gold)" stroke-width="1.5" opacity="0.9"/>

  <!-- TS monogram -->
  <text x="50%" y="54%"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="38"
        font-weight="700"
        letter-spacing="-1"
        fill="url(#ts-gold)">TS</text>
</svg>
